
name: Build Rihlat AlEman APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "rihla_android (3).zip"
          mkdir -p project
          unzip -q "rihla_android (3).zip" -d project
          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect Android source files
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PROJECT FILES ==="
          find "$PROJECT_DIR" -type f \\( -name '*.kt' -o -name '*.java' -o -name 'AndroidManifest.xml' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name '*.html' \\) -print | sort
          echo "=== MAIN ACTIVITY / MANIFEST / APP GRADLE ==="
          find "$PROJECT_DIR" -type f \\( -name 'MainActivity.kt' -o -name 'AndroidManifest.xml' -o -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \\) -print -exec sed -n '1,260p' {} \\;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install Android SDK components
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rihlat-AlEman-v14.0-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
