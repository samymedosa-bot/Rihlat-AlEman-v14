name: Build Rihlat AlEman APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f "rihla_android (3).zip"
          mkdir -p project
          unzip -q "rihla_android (3).zip" -d project

          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS_FILE"

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          import os
          import re

          path = os.path.join(os.environ["PROJECT_DIR"], "app", "build.gradle")

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content = content.replace("VERSION_1_8", "VERSION_17")
          content = re.sub(r"(sourceCompatibility\s+)[\"']?1\.8[\"']?", r"\g<1>JavaVersion.VERSION_17", content)
          content = re.sub(r"(targetCompatibility\s+)[\"']?1\.8[\"']?", r"\g<1>JavaVersion.VERSION_17", content)
          content = re.sub(r"(jvmTarget\s*=\s*)[\"']1\.8[\"']", r'\g<1>"17"', content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Updated Java/Kotlin targets to 17")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rihlat-AlEman-v14.0-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
