name: Build Rihlat AlEman APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "rihla_android (3).zip"
          mkdir -p project
          unzip -q "rihla_android (3).zip" -d project
          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect Android notification configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "=== MANIFEST ==="
          sed -n '1,260p' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "=== APP GRADLE ==="
          sed -n '1,260p' "$PROJECT_DIR/app/build.gradle"
          echo "=== ROOT GRADLE AND SETTINGS ==="
          sed -n '1,200p' "$PROJECT_DIR/build.gradle"
          sed -n '1,160p' "$PROJECT_DIR/settings.gradle"
          echo "=== JAVA/KOTLIN SOURCE TREE ==="
          find "$PROJECT_DIR/app/src/main" -maxdepth 7 -type f | sort
          echo "=== SERVICE WORKER ==="
          find "$PROJECT_DIR/app/src/main/assets/rihla_v137" -maxdepth 2 -iname '*sw*' -o -iname '*manifest*'

      - name: Inspect native activity source
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR/app/src/main" -type f | grep -E '\.(kt|java)

      - name: Inspect prayer notification integration points
        shell: bash
        run: |
          set -euo pipefail
          HTML="$PROJECT_DIR/app/src/main/assets/rihla_v137/index.html"
          echo "=== PRAYER TIMES SOURCE ==="
          sed -n '1810,1940p' "$HTML"
          echo "=== NATIVE BRIDGE INSERTION POINTS ==="
          sed -n '1960,2095p' "$HTML"
          echo "=== INITIALIZATION ==="
          sed -n '3330,3410p' "$HTML"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install Android SDK components
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rihlat-AlEman-v14.0-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
 | while IFS= read -r SOURCE; do
            echo "=== SOURCE: $SOURCE ==="
            sed -n '1,360p' "$SOURCE"
          done

      - name: Inspect prayer notification integration points
        shell: bash
        run: |
          set -euo pipefail
          HTML="$PROJECT_DIR/app/src/main/assets/rihla_v137/index.html"
          echo "=== PRAYER TIMES SOURCE ==="
          sed -n '1810,1940p' "$HTML"
          echo "=== NATIVE BRIDGE INSERTION POINTS ==="
          sed -n '1960,2095p' "$HTML"
          echo "=== INITIALIZATION ==="
          sed -n '3330,3410p' "$HTML"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install Android SDK components
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rihlat-AlEman-v14.0-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
