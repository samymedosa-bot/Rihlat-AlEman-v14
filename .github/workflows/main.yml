name: Build Rihlat AlEman APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "rihla_android (3).zip"
          mkdir -p project
          unzip -q "rihla_android (3).zip" -d project
          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect native Android source
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR/app/src/main" -type f \( -name '*.kt' -o -name '*.java' \) -print -exec sed -n '1,360p' {} \;

      - name: Configure Java and Kotlin targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if 'compileOptions {' in s:
              import re
              s = re.sub(r'compileOptions\s*\{.*?\}', 'compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }', s, flags=re.S, count=1)
          else:
              s += '\n\nandroid { compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }\n'
          if 'kotlinOptions {' in s:
              import re
              s = re.sub(r'kotlinOptions\s*\{.*?\}', 'kotlinOptions { jvmTarget = "17" }', s, flags=re.S, count=1)
          else:
              s += '\n\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { jvmTarget = "17" } }\n'
          p.write_text(s)
          PY
          echo "=== EFFECTIVE APP GRADLE ==="
          sed -n '1,260p' "$PROJECT_DIR/app/build.gradle"

      - name: Inspect prayer integration points
        shell: bash
        run: |
          set -euo pipefail
          echo "=== MANIFEST ==="
          sed -n '1,240p' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          HTML=$(find "$PROJECT_DIR/app/src/main/assets" -path '*/index.html' -print -quit)
          echo "=== HTML PATH: $HTML ==="
          grep -n -E 'fetchPrayerTimes|updateNextPrayer|prayerTimes|notification|adhan|localStorage' "$HTML" | head -100 || true
          echo "=== HTML PRAYER FUNCTION CONTEXT ==="
          python3 - "$HTML" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(errors='replace')
          for pat in ['fetchPrayerTimes','updateNextPrayer','prayerTimes']:
              m=re.search(pat,s)
              if m: print('\\n---',pat,'---\\n',s[max(0,m.start()-900):m.start()+2200])
          PY

      - name: Apply Android v14.2 prayer alarms
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re,sys
          root=Path(sys.argv[1]); app=root/'app'
          gradle=app/'build.gradle'; g=gradle.read_text()
          g=re.sub(r'versionCode\s+\d+', 'versionCode 143', g)
          g=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "14.3"', g)
          gradle.write_text(g)
          manifest=app/'src/main/AndroidManifest.xml'; m=manifest.read_text()
          if 'SCHEDULE_EXACT_ALARM' not in m: m=m.replace('<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />','<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />')
          if 'PrayerAlarmReceiver' not in m: m=m.replace('        <activity','        <receiver android:name=".PrayerAlarmReceiver" android:enabled="true" android:exported="false" />\n        <activity')
          manifest.write_text(m)
          src=app/'src/main/java/com/samymedo/rihla'; src.mkdir(parents=True,exist_ok=True)
          (src/'PrayerAlarmReceiver.kt').write_text(r'''package com.samymedo.rihla
          import android.app.*
          import android.content.*
          import android.os.Build
          import java.util.Calendar
          class PrayerAlarmReceiver : BroadcastReceiver() {
          override fun onReceive(context: Context, intent: Intent) {
          val prayer=intent.getStringExtra("prayer") ?: "الصلاة"; val id=intent.getIntExtra("id",100)
          val channel="prayer_times"; val manager=context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
          if(Build.VERSION.SDK_INT>=26) manager.createNotificationChannel(NotificationChannel(channel,"تنبيهات الصلاة",NotificationManager.IMPORTANCE_HIGH))
          val launch=context.packageManager.getLaunchIntentForPackage(context.packageName)
          val open=PendingIntent.getActivity(context,0,launch,PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
          val builder=if(Build.VERSION.SDK_INT>=26) Notification.Builder(context,channel) else Notification.Builder(context)
          builder.setSmallIcon(context.applicationInfo.icon).setContentTitle("حان الآن موعد صلاة $prayer").setContentText("حيّ على الصلاة • رحلة الإيمان").setAutoCancel(true).setContentIntent(open)
          if(Build.VERSION.SDK_INT<26) builder.setPriority(Notification.PRIORITY_HIGH)
          manager.notify(id,builder.build())
          val h=intent.getIntExtra("hour",0); val m=intent.getIntExtra("minute",0)
          val next=Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR,1); set(Calendar.HOUR_OF_DAY,h); set(Calendar.MINUTE,m); set(Calendar.SECOND,0); set(Calendar.MILLISECOND,0) }
          val again=Intent(context,PrayerAlarmReceiver::class.java).putExtra("prayer",prayer).putExtra("id",id).putExtra("hour",h).putExtra("minute",m)
          val pi=PendingIntent.getBroadcast(context,id,again,PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
          val am=context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
          if(Build.VERSION.SDK_INT>=23) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,next.timeInMillis,pi) else am.setExact(AlarmManager.RTC_WAKEUP,next.timeInMillis,pi)
          }
          }
          ''')
          main=src/'MainActivity.kt'; s=main.read_text()
          s=s.replace('import android.webkit.WebViewClient','import android.webkit.WebViewClient\nimport android.content.Context\nimport android.webkit.JavascriptInterface\nimport android.app.AlarmManager\nimport android.app.PendingIntent\nimport android.content.Intent\nimport org.json.JSONObject\nimport java.util.Calendar')
          s=s.replace('        setContentView(webView)','        webView.addJavascriptInterface(PrayerBridge(this), "PrayerNative")\n        setContentView(webView)')
          s=s.replace('    override fun onRequestPermissionsResult', '    fun notifyNotificationPermissionResult(granted: Boolean) {\n        if (::webView.isInitialized) webView.post {\n            webView.evaluateJavascript("window.onNativeNotificationPermissionResult($granted);", null)\n        }\n    }\n\n    override fun onRequestPermissionsResult')
          s=s.replace('        if (requestCode == geoRequest) {\n            val granted = hasLocationPermission()\n            geoCallback?.invoke(geoOrigin, granted, false)\n            geoCallback = null\n            geoOrigin = null\n        }', '        if (requestCode == geoRequest) {\n            val granted = hasLocationPermission()\n            geoCallback?.invoke(geoOrigin, granted, false)\n            geoCallback = null\n            geoOrigin = null\n        } else if (requestCode == 502) {\n            notifyNotificationPermissionResult(checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED)\n        }')
          s=s.replace('        if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {\n            requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 502)\n        }\n','')
          s += r'''
          class PrayerBridge(private val context: Activity) {
          @JavascriptInterface fun requestPermission() {
          context.runOnUiThread {
          if(Build.VERSION.SDK_INT>=33 && context.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED) context.requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS),502)
          else (context as? MainActivity)?.notifyNotificationPermissionResult(true)
          }
          }
          @JavascriptInterface fun schedule(timesJson:String, enabled:Boolean) {
          val am=context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
          val names=listOf("الفجر","الظهر","العصر","المغرب","العشاء"); val keys=listOf("fajr","dhuhr","asr","maghrib","isha"); val ids=listOf(2101,2102,2103,2104,2105)
          for(id in ids) { val pi=PendingIntent.getBroadcast(context,id,Intent(context,PrayerAlarmReceiver::class.java),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE); am.cancel(pi); pi.cancel() }
          if(!enabled) return
          try { val data=JSONObject(timesJson); for(i in keys.indices) {
          val raw=data.optString(keys[i],""); if(!raw.matches(Regex("\\d{1,2}:\\d{2}"))) continue
          val p=raw.split(":"); val h=p[0].toInt(); val m=p[1].toInt()
          val cal=Calendar.getInstance().apply { set(Calendar.HOUR_OF_DAY,h); set(Calendar.MINUTE,m); set(Calendar.SECOND,0); set(Calendar.MILLISECOND,0); if(timeInMillis<=System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR,1) }
          val intent=Intent(context,PrayerAlarmReceiver::class.java).putExtra("prayer",names[i]).putExtra("id",ids[i]).putExtra("hour",h).putExtra("minute",m)
          val pi=PendingIntent.getBroadcast(context,ids[i],intent,PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
          if(Build.VERSION.SDK_INT>=23) { if(Build.VERSION.SDK_INT>=31 && !am.canScheduleExactAlarms()) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,cal.timeInMillis,pi) else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,cal.timeInMillis,pi) } else am.setExact(AlarmManager.RTC_WAKEUP,cal.timeInMillis,pi)
          } } catch(_:Exception) {}
          }
          }
          '''
          main.write_text(s)
          html=next((app/'src/main/assets').rglob('index.html')); h=html.read_text()
          anchor="prayerTimes = {fajr:t.Fajr.split(' ')[0], sunrise:t.Sunrise.split(' ')[0], dhuhr:t.Dhuhr.split(' ')[0], asr:t.Asr.split(' ')[0], maghrib:t.Maghrib.split(' ')[0], isha:t.Isha.split(' ')[0]};"
          if anchor not in h: raise SystemExit('Prayer times anchor not found')
          h=h.replace(anchor,anchor+"\n      try { if(window.PrayerNative) PrayerNative.schedule(JSON.stringify(prayerTimes), !!settings.notifications); } catch(e) {}")
          h=h.replace("localStorage.setItem('rihlati_settings', JSON.stringify(settings));", "localStorage.setItem('rihlati_settings', JSON.stringify(settings));\n  try { if(window.PrayerNative && prayerTimes && prayerTimes.fajr) PrayerNative.schedule(JSON.stringify(prayerTimes), !!settings.notifications); } catch(e) {}")
          compat = r'''<script id="native-notification-compat">
          (function () {
            const fallbackToggle = window.toggleNotifications;
            window.onNativeNotificationPermissionResult = function (granted) {
              const toggle = document.getElementById('notificationsToggle');
              settings.notifications = !!granted;
              if (toggle) toggle.checked = !!granted;
              localStorage.setItem('rihlati_settings', JSON.stringify(settings));
              try { if (window.PrayerNative && prayerTimes && prayerTimes.fajr) PrayerNative.schedule(JSON.stringify(prayerTimes), !!granted); }
              catch (e) { console.warn('Native prayer scheduling failed:', e); }
              if (!granted) alert('لم يتم منح إذن الإشعارات. يمكنك السماح به من إعدادات التطبيق في Android.');
            };
            window.toggleNotifications = function () {
              const toggle = document.getElementById('notificationsToggle');
              if (!toggle) return;
              if (!window.PrayerNative || typeof PrayerNative.requestPermission !== 'function') {
                if (typeof fallbackToggle === 'function') return fallbackToggle();
                return;
              }
              if (toggle.checked) PrayerNative.requestPermission();
              else {
                settings.notifications = false;
                localStorage.setItem('rihlati_settings', JSON.stringify(settings));
                try { if (prayerTimes && prayerTimes.fajr) PrayerNative.schedule(JSON.stringify(prayerTimes), false); }
                catch (e) { console.warn('Native prayer cancellation failed:', e); }
              }
            };
          })();
          </script>'''
          if 'id="native-notification-compat"' not in h:
              if '</body>' not in h: raise SystemExit('HTML body closing tag not found')
              h=h.replace('</body>', compat+'\n</body>')
          html.write_text(h)
          sw=next((app/'src/main/assets').rglob('sw.js'),None)
          if sw is None: raise SystemExit('Service worker not found')
          worker=sw.read_text()
          worker=worker.replace("rihla-app-v14-0", "rihla-app-v14-3")
          sw.write_text(worker)
          print('Applied native prayer alarms, refreshed service-worker cache, and version 14.3')
          PY


      - name: Fix pre-prayer reminders and bundle offline adhan audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re, sys
          app=Path(sys.argv[1])/'app'
          src=app/'src/main/java/com/samymedo/rihla'
          receiver=src/'PrayerAlarmReceiver.kt'
          r=receiver.read_text()
          r=r.replace('val channel="prayer_times"; val manager=', 'val isPre=intent.getBooleanExtra("isPre",false); val preType=intent.getStringExtra("preType") ?: "adhan"\n          val title=if(isPre) "تذكير قبل صلاة $prayer" else "حان الآن موعد صلاة $prayer"\n          val body=if(!isPre) "حيّ على الصلاة • رحلة الإيمان" else when(preType) { "takbeer" -> "الله أكبر، الله أكبر — اقترب موعد الصلاة"; "gentle" -> "اقترب موعد الصلاة، خذ استراحة واستعد لها 🌿"; "silent" -> "تذكير صامت: اقترب موعد الصلاة"; else -> "استعد للصلاة — اقترب موعد الأذان 🕌" }\n          val channel="prayer_times"; val manager=')
          r=r.replace('.setContentTitle("حان الآن موعد صلاة $prayer").setContentText("حيّ على الصلاة • رحلة الإيمان")', '.setContentTitle(title).setContentText(body)')
          r=r.replace('.putExtra("minute",m)\n', '.putExtra("minute",m).putExtra("isPre",isPre).putExtra("preType",preType)\n')
          receiver.write_text(r)
          main=src/'MainActivity.kt'; m=main.read_text()
          if 'fun schedulePrePrayer(' not in m:
              pos=m.rfind('}')
              method=r"""
          @JavascriptInterface fun schedulePrePrayer(timesJson:String, enabled:Boolean, leadMinutes:Int, prayersCsv:String, preType:String) {
          val am=context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
          val names=listOf("الفجر","الظهر","العصر","المغرب","العشاء")
          val keys=listOf("fajr","dhuhr","asr","maghrib","isha")
          val ids=listOf(2201,2202,2203,2204,2205)
          for(id in ids) { val old=PendingIntent.getBroadcast(context,id,Intent(context,PrayerAlarmReceiver::class.java),PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE); am.cancel(old); old.cancel() }
          if(!enabled) return
          try {
            val data=JSONObject(timesJson); val selected=prayersCsv.split(",").toSet()
            for(i in keys.indices) {
              if(!selected.contains(keys[i])) continue
              val raw=data.optString(keys[i],""); if(!raw.matches(Regex("\\d{1,2}:\\d{2}"))) continue
              val p=raw.split(":"); val h=p[0].toInt(); val minute=p[1].toInt()
              val cal=Calendar.getInstance().apply { set(Calendar.HOUR_OF_DAY,h); set(Calendar.MINUTE,minute); set(Calendar.SECOND,0); set(Calendar.MILLISECOND,0); add(Calendar.MINUTE,-leadMinutes); if(timeInMillis<=System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR,1) }
              val intent=Intent(context,PrayerAlarmReceiver::class.java).putExtra("prayer",names[i]).putExtra("id",ids[i]).putExtra("hour",cal.get(Calendar.HOUR_OF_DAY)).putExtra("minute",cal.get(Calendar.MINUTE)).putExtra("isPre",true).putExtra("preType",preType)
              val pi=PendingIntent.getBroadcast(context,ids[i],intent,PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              if(Build.VERSION.SDK_INT>=23) { if(Build.VERSION.SDK_INT>=31 && !am.canScheduleExactAlarms()) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,cal.timeInMillis,pi) else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,cal.timeInMillis,pi) } else am.setExact(AlarmManager.RTC_WAKEUP,cal.timeInMillis,pi)
            }
          } catch(_:Exception) {}
          }
          """
              m=m[:pos]+method+m[pos:]
              main.write_text(m)
          html=next((app/'src/main/assets').rglob('index.html')); h=html.read_text()
          pattern=r'async function togglePrePrayerReminder\(\)\s*\{.*?\n\}'
          replacement=r'''async function togglePrePrayerReminder(){
            const toggle=document.getElementById('prePrayerToggle'); if(!toggle)return;
            if(toggle.checked){
              let granted=true;
              if(window.PrayerNative && PrayerNative.requestPermission){ PrayerNative.requestPermission(); granted=true; }
              else granted=await ensurePrayerNotificationPermission();
              if(!granted){toggle.checked=false;settings.prePrayerReminder=false;return;}
              settings.prePrayerReminder=true;settings.notifications=true;
              const mainToggle=document.getElementById('notificationsToggle');if(mainToggle)mainToggle.checked=true;
            }else settings.prePrayerReminder=false;
            saveSettings();
            syncNativePrePrayer();
          }
          function syncNativePrePrayer(){
            try{
              if(window.PrayerNative && prayerTimes && prayerTimes.fajr){
                PrayerNative.schedulePrePrayer(JSON.stringify(prayerTimes),!!settings.prePrayerReminder,Number(settings.prePrayerMinutes||10),(settings.prePrayerPrayers||[]).join(','),settings.prePrayerType||'adhan');
              }
            }catch(e){console.warn('Native pre-prayer schedule failed',e);}
          }'''
          h,n=re.subn(pattern,lambda _:replacement,h,count=1,flags=re.S)
          if not n: raise SystemExit('togglePrePrayerReminder function not found')
          # Re-sync after fresh prayer times and after reminder settings change.
          h=h.replace('try { if(window.PrayerNative) PrayerNative.schedule(JSON.stringify(prayerTimes), !!settings.notifications); } catch(e) {}',
                      'try { if(window.PrayerNative) PrayerNative.schedule(JSON.stringify(prayerTimes), !!settings.notifications); } catch(e) {}\n      try { syncNativePrePrayer(); } catch(e) {}')
          h=h.replace('  saveSettings();\n}\nfunction initPrayerAlertSettings()', '  saveSettings();\n  try { syncNativePrePrayer(); } catch(e) {}\n}\nfunction initPrayerAlertSettings()')
          # Use bundled asset files as the download source, so WebView CORS does not block saving.
          h=h.replace("fetch(sound.url,{mode:'cors',cache:'no-store'})", "fetch('./adhan/'+sound.id+'.mp3',{cache:'force-cache'})")
          h=h.replace("const url=stored?URL.createObjectURL(stored):sound.url;", "const url=stored?URL.createObjectURL(stored):('./adhan/'+sound.id+'.mp3');")
          h=h.replace("return stored?URL.createObjectURL(stored):sound.url;", "return stored?URL.createObjectURL(stored):('./adhan/'+sound.id+'.mp3');")
          html.write_text(h)
          print('Applied native pre-prayer scheduling and offline audio asset references')
          PY
          ASSET_DIR=$(find "$PROJECT_DIR/app/src/main/assets" -type d -name 'rihla_v*' -print -quit)
          test -n "$ASSET_DIR"
          mkdir -p "$ASSET_DIR/adhan"
          curl -fLsS --retry 3 "https://cdn.aladhan.com/audio/adhans/a9.mp3" -o "$ASSET_DIR/adhan/afasy.mp3"
          curl -fLsS --retry 3 "https://cdn.aladhan.com/audio/adhans/a4.mp3" -o "$ASSET_DIR/adhan/afasy_dubai.mp3"
          curl -fLsS --retry 3 "https://cdn.aladhan.com/audio/adhans/a7.mp3" -o "$ASSET_DIR/adhan/afasy_alt.mp3"
          curl -fLsS --retry 3 "https://cdn.aladhan.com/audio/adhans/a1.mp3" -o "$ASSET_DIR/adhan/nafees.mp3"
          curl -fLsS --retry 3 "https://cdn.aladhan.com/audio/adhans/a11-mansour-al-zahrani.mp3" -o "$ASSET_DIR/adhan/mansour.mp3"
          find "$ASSET_DIR/adhan" -type f -size +10k | grep -q .
          echo "Bundled offline adhan audio assets"

      - name: Add native Android audio file picker and correct reminder permission flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re, sys
          root=Path(sys.argv[1])
          gradle=root/'app/build.gradle'
          g=gradle.read_text()
          g=re.sub(r'versionCode\\s+\\d+', 'versionCode 144', g)
          g=re.sub(r'versionName\\s+["\\'][^"\\']+["\\']', 'versionName "14.4"', g)
          gradle.write_text(g)
          main=root/'app/src/main/java/com/samymedo/rihla/MainActivity.kt'
          s=main.read_text()
          imports='\\n'.join(['import android.net.Uri','import android.webkit.ValueCallback','import android.content.ClipData'])
          if 'import android.net.Uri' not in s:
              s=s.replace('import android.webkit.WebViewClient', 'import android.webkit.WebViewClient\\n'+imports)
          if 'private var uploadFileCallback' not in s:
              s=s.replace('    private lateinit var webView: WebView', '    private lateinit var webView: WebView\\n    private var uploadFileCallback: ValueCallback<Array<Uri>>? = null')
          old='''        webView.webChromeClient = object : WebChromeClient() {
                      override fun onGeolocationPermissionsShowPrompt'''
          new='''        webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(view: WebView?, callback: ValueCallback<Array<Uri>>, params: FileChooserParams?): Boolean {
                          uploadFileCallback?.onReceiveValue(null)
                          uploadFileCallback = callback
                          return try {
                              val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "audio/*"
                                  putExtra(Intent.EXTRA_ALLOW_MULTIPLE, false)
                              }
                              startActivityForResult(intent, 1001)
                              true
                          } catch (e: Exception) {
                              uploadFileCallback = null
                              callback.onReceiveValue(null)
                              false
                          }
                      }
                      override fun onGeolocationPermissionsShowPrompt'''
          if 'override fun onShowFileChooser' not in s:
              if old not in s: raise SystemExit('WebChromeClient insertion point not found')
              s=s.replace(old,new,1)
          if 'requestCode == 1001' not in s:
              insert='''    override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001) {
                      val callback = uploadFileCallback ?: return
                      uploadFileCallback = null
                      val result = if (resultCode == Activity.RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      callback.onReceiveValue(result)
                  }
              }

          '''
              s=s.replace('    override fun onRequestPermissionsResult',insert+'    override fun onRequestPermissionsResult',1)
          main.write_text(s)
          html=next((root/'app/src/main/assets').rglob('index.html'))
          h=html.read_text()
          h=h.replace('''    let granted=true;
                  if(window.PrayerNative && PrayerNative.requestPermission){ PrayerNative.requestPermission(); granted=true; }
                  else granted=await ensurePrayerNotificationPermission();''','''    let granted=false;
                  if(window.PrayerNative && PrayerNative.requestPermission){
                    granted=await new Promise(resolve=>{
                      window.__prePrayerPermissionResolve=resolve;
                      PrayerNative.requestPermission();
                    });
                  } else granted=await ensurePrayerNotificationPermission();''')
          h=h.replace('''            window.onNativeNotificationPermissionResult = function (granted) {
                      const toggle''','''            window.onNativeNotificationPermissionResult = function (granted) {
                      if (window.__prePrayerPermissionResolve) {
                        const resolve=window.__prePrayerPermissionResolve;
                        window.__prePrayerPermissionResolve=null;
                        resolve(!!granted);
                      }
                      const toggle''')
          if 'window.__prePrayerPermissionResolve' not in h:
              raise SystemExit('Could not wire asynchronous pre-prayer permission callback')
          html.write_text(h)
          sw=next((root/'app/src/main/assets').rglob('sw.js'),None)
          if sw:
              sw.write_text(sw.read_text().replace('rihla-app-v14-3','rihla-app-v14-4'))
          print('Added Android audio document picker and fixed async notification permission handling.')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          mkdir -p apk-output
          find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rihlat-AlEman-v14.4-APK
          path: apk-output/*.apk
          if-no-files-found: error
